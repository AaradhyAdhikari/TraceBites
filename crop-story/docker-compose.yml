services:
  postgres:
    image: postgres:16-alpine
    container_name: crop-story-db
    environment:
      POSTGRES_USER: cropstory
      POSTGRES_PASSWORD: cropstory
      POSTGRES_DB: cropstory
    ports:
      - "5433:5432"
    volumes:
      - cropstory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropstory"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cropstory_pgdata:
